name: CI

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piratecult_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piratecult_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Verify database migration files
        run: npm run check:migrations
      - name: Prepare Supabase roles in PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/piratecult_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL
      - name: Apply all migrations to a clean PostgreSQL database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/piratecult_test
          NODE_ENV: production
          DATABASE_SSL: 'false'
        run: npm run db:migrate
      - name: Verify migration runner is idempotent
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/piratecult_test
          NODE_ENV: production
          DATABASE_SSL: 'false'
        run: npm run db:migrate
      - name: Unit tests
        run: npm test
      - name: Build frontend and server
        run: npm run build
